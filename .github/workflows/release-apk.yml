name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cmdtools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$RUNNER_TEMP/cmdtools"
          unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdtools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare release asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Mode-3G-4G.apk
          echo "APK bytes: $(wc -c < dist/Mode-3G-4G.apk)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mode-3G-4G
          path: dist/Mode-3G-4G.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > release-notes.md <<'EOF'
          APK de débogage, prêt à installer sur le Redmi Note 10 Pro.

          Téléchargement direct : [Mode-3G-4G.apk](https://github.com/${{ github.repository }}/releases/download/latest/Mode-3G-4G.apk)

          L’application force le réseau mobile en 3G (WCDMA uniquement) ou en 4G (LTE préféré). Après une préparation (débogage sans fil ou adb tcpip 5555), les boutons passent par ADB sur 127.0.0.1, sans Wi-Fi. Le port se referme au redémarrage. Shizuku et le menu radio restent des secours.
          EOF
          if gh release view latest >/dev/null 2>&1; then
            gh release delete latest --yes --cleanup-tag
          fi
          gh release create latest dist/Mode-3G-4G.apk \
            --target "${{ github.sha }}" \
            --title "Mode 3G/4G" \
            --notes-file release-notes.md \
            --latest

      - name: Print download URL
        run: echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/latest/Mode-3G-4G.apk"
